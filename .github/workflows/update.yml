name: Update
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: josStorer/get-current-time@v2.1.3
        id: current-time
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: |
          node update.ts
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data
          if ! git diff --cached --quiet -- data; then
            git commit -m "Update ${{ steps.current-time.outputs.time }}"
            git push
          fi
